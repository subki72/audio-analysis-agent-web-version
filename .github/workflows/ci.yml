name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Code Style & Linting (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Check
        run: ruff check src tests web_api.py mcp_server.py

  test:
    name: Automated Test Suite (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Audio Dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: pytest tests/ -v

  build-and-security:
    name: Docker Build & Security Scans
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scanner
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true
        with:
          config: p/python

      - name: Build Production Docker Image
        run: docker build -t voicescript-api:ci .

      - name: Run Trivy Container Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: voicescript-api:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
